[package]
name = "log-morning"
version = "0.1.1"
description = "내 AWS 계정의 CloudWatch 로그를 S3에 백업하고 확인하는 데스크톱 앱"
authors = ["Log Morning contributors"]
edition = "2024"

[lib]
name = "log_morning_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-sdk-cloudformation = "1"
aws-sdk-cloudwatchlogs = "1.145.0"
aws-sdk-lambda = "1.138.0"
aws-sdk-s3 = "1.141.0"
aws-sdk-sts = "1.110.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
hex = "0.4"
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
