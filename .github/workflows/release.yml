name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 로그 모닝 ${{ github.ref_name }}
          releaseBody: |
            CloudWatch 로그를 사용자의 AWS 계정 안에서 S3로 백업하고 확인하는 데스크톱 앱입니다.

            - macOS: Apple Silicon 또는 Intel용 DMG를 선택하세요.
            - Windows: x64 설치 파일을 선택하세요.
            - AWS 자격 증명과 로그는 개발자 서버로 전송되지 않습니다.
            - 현재 설치 파일은 공인 코드 서명·공증 전이므로 운영체제의 보안 경고가 표시될 수 있습니다.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          releaseAssetNamePattern: log-morning_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
